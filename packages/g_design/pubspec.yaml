name: g_design
description: "Immersive minimalism for every Mindberzerk app: floating chrome, one raised sheet, edge-to-edge rows and one big figure per screen."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.1

# Flutter only. Each app supplies its own palette and type through
# GDesignTheme, so nothing here knows which app it is drawing.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
